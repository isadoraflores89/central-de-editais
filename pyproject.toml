[project]
name = "central-de-editais"
version = "0.1.0"
description = "Radar aberto de editais, patrocínios e credenciamentos culturais do Brasil"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "types-openpyxl",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # travessões e aspas tipográficas em textos pt-BR

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["pipeline", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
