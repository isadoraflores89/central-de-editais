# Agente Instagram: contas e hashtags vigiadas pelo robô diário (pipeline/collectors/instagram.py).
# Só contas profissionais (empresa/criador) podem ser lidas pela API oficial da Meta; conta pessoal
# ou @ errado dá "[aviso] instagram @x" no log e é pulada, sem derrubar o resto.
# Hashtags: a Meta permite 30 diferentes por semana por conta; o robô usa no máximo
# `hashtags_por_rodada` por dia, em rodízio.
# Ampliado em 17/11/2026 com as fontes das planilhas (config/fontes/). Os @ marcados "confirmar"
# foram deduzidos do nome da instituição: conferir no Instagram e corrigir aqui.

