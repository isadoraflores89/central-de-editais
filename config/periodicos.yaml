# Revistas acadêmicas em OJS acompanhadas pelo coletor `ojs`.
# O coletor lê <url_base>/announcement e guarda só avisos que parecem chamada.
# Qualis e ISSN NUNCA são inferidos: preencha aqui com a fonte (Sucupira) ou deixe vazio.
# Campos: id (único, sem espaços), nome, url_base, areas[], idiomas[], issn, qualis,
#         indexadores[], link_normas, pais (ISO-2, padrão BR), ativo (padrão true).

- id: pculturais
  nome: Políticas Culturais em Revista (UFBA)
  url_base: https://periodicos.ufba.br/index.php/pculturais
  areas: [politicas_culturais, gestao_cultural]
  idiomas: [pt, es, en]
  issn: "1983-3717"
  link_normas: https://periodicos.ufba.br/index.php/pculturais/about/submissions

- id: contemporanea_ufba
  nome: Contemporânea — Revista de Comunicação e Cultura (UFBA)
  url_base: https://periodicos.ufba.br/index.php/contemporaneaposcom
  areas: [comunicacao, estudos_culturais]
  idiomas: [pt, es, en]

- id: revista_observatorio_itau
  nome: Revista Observatório Itaú Cultural
  url_base: https://www.itaucultural.org.br/observatorio/revista
  areas: [politicas_culturais, economia_criativa]
  idiomas: [pt]
  ativo: false   # não é OJS; entra em outro coletor

