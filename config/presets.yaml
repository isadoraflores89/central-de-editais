# Buscas prontas do site. Cada preset é um conjunto de filtros no mesmo
# formato da URL do site (o que aparece depois do "?"). Para criar um preset,
# filtre no site, copie o final do endereço e cole aqui.
#
# Filtros disponíveis: q, tipo, mec, abr, uf, area, prop, pub, fonte, status,
# prazo (7|15|30|60|continuo), de, ate (AAAA-MM-DD), pf=1, sem_aprovado=1,
# encerrados=1, destaques=1, nacionais=0, vmin, vmax, vnull=0, ordem.

# Os estados (26 + DF) ficam na lista "Editais do seu estado", logo antes destes botões.

- id: rouanet-esporte
  rotulo: Rouanet e Lei do Esporte
  descricao: Chamadas ligadas à Lei Rouanet ou à Lei de Incentivo ao Esporte.
  filtros: "mec=rouanet,lei_esporte"

- id: patrocinio-corporativo
  rotulo: Patrocínio corporativo (fluxo contínuo)
  descricao: Empresas e institutos que recebem propostas o ano todo.
  filtros: "tipo=patrocinio_direto,patrocinio_incentivado,banco_projetos&prazo=continuo"

- id: parecerista
  rotulo: Parecerista / credenciamentos
  descricao: Credenciamentos de pareceristas e prestadores de serviço.
  filtros: "tipo=credenciamento"

- id: audiovisual
  rotulo: Audiovisual
  descricao: Cinema, séries, clipes e circulação audiovisual.
  filtros: "area=audiovisual"

- id: fecha-esta-semana
  rotulo: Fecha esta semana
  descricao: Prazos que terminam nos próximos 7 dias.
  filtros: "prazo=7&ordem=prazo"
