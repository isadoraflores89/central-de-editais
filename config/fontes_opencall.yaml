  ativo: false   # desafio anti-robô; avaliar newsletter

- id: ibermusicas
  nome: Ibermúsicas
  url: https://ibermusicas.org/convocatorias/
  metodo: html
  ativo: false

- id: iberescena
  nome: Iberescena
  url: https://www.iberescena.org/convocatorias
  metodo: html
  ativo: false

- id: iberculturaviva
  nome: IberCultura Viva
  url: https://iberculturaviva.org/convocatorias/
  metodo: html
  ativo: false

- id: prohelvetia
  nome: Pro Helvetia (América do Sul)
  url: https://prohelvetia.ch/en/open-calls/
  metodo: html
  ativo: false

- id: goethe
  nome: Goethe-Institut (Brasil)
