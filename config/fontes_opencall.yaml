# Fontes de open calls internacionais. `metodo` diz como o coletor acessa:
# rss | html | manual. `ativo: false` deixa documentado sem rodar.
# Detalhes de cada fonte (o que foi verificado) em docs/FONTES.md.

- id: onthemove
  nome: On the Move
  url: https://on-the-move.org/feed
  metodo: rss
  coletor: pipeline.collectors.onthemove
  ativo: true

- id: transartists
  nome: TransArtists (DutchCulture)
  url: https://www.transartists.org/en/open-calls
  metodo: html
  ativo: false   # próxima rodada: HTML, sem RSS

- id: resartis
  nome: Res Artis
  url: https://resartis.org/open-calls/
