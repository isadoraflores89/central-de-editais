# Radar de resultados e radar de vagas na cultura — versão RESERVA com Gemini.
# A versão principal é o agente do Claude (routine na nuvem, toda segunda às 05:00 em
# Salvador), que grava data/resultados.json e data/vagas.json e dá push. Este workflow
# só roda na mão (Run workflow) se o agente falhar; precisa do secret GEMINI_API_KEY.
name: Radar semanal (reserva com Gemini)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-semanal
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bahia
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar resultados e vagas
        run: python integracoes/radar/atualizar.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit (se mudou)
        run: |
          if [ -n "$(git status --porcelain data/resultados.json data/vagas.json)" ]; then
            git config user.name "central-de-editais[bot]"
            git config user.email "central-de-editais@users.noreply.github.com"
            git add data/resultados.json data/vagas.json
            git commit -m "chore(radar): resultados e vagas $(date +%F)"
            git push
          else
            echo "Sem mudanças."
          fi
