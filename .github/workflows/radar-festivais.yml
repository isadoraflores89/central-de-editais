# Radar de festivais: toda SEGUNDA às 05:30 em Salvador (08:30 UTC) e sob demanda.
# Junta convocatórias abertas (Gemini pesquisa na web) com o calendário do Mapa dos Festivais
# e grava data/festivais.json. A "Atualização diária" copia o arquivo para a API pública.
name: Radar de festivais

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-festivais
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bahia
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar convocatórias e calendário
        run: python integracoes/radar/festivais.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit (se mudou)
        run: |
          if [ -n "$(git status --porcelain data/festivais.json)" ]; then
            git config user.name "central-de-editais[bot]"
            git config user.email "central-de-editais@users.noreply.github.com"
            git add data/festivais.json
            git commit -m "chore(radar): festivais $(date +%F)"
            git push
          else
            echo "Sem mudanças."
          fi
