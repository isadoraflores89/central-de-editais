# Conteúdo semanal (Fase 5): toda QUARTA às 05:00 em Salvador (08:00 UTC) gera
# rascunhos de post para LinkedIn, carrossel, newsletter e alertas em content/,
# manda o rascunho da newsletter por e-mail para a Isadora e deixa tudo no painel
# de disparos (editais.isadoraflores.art.br, menu Disparos). Ela edita e publica na segunda.
# NÃO publica em lugar nenhum sozinho. Roda antes da "Atualização diária" (09:00 UTC),
# que copia content/ para o site.
name: Conteúdo semanal

on:
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-conteudo
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bahia
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Gerar conteúdo da semana
        run: uv run python -m pipeline conteudo | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mostrar o post no resumo
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat content/weekly/"$(date +%G-%V)".md >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Enviar o rascunho por e-mail para a Isadora
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
          EMAIL_RASCUNHO_PARA: ${{ vars.EMAIL_RASCUNHO_PARA }}
        run: uv run python integracoes/apoiadores/enviar_rascunho.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit (se mudou)
        run: |
          if [ -n "$(git status --porcelain content/)" ]; then
            git config user.name "central-de-editais[bot]"
            git config user.email "central-de-editais@users.noreply.github.com"
            git add content/
            git commit -m "content: semana $(date +%G-%V)"
            git push
          else
            echo "Sem mudanças em content/."
          fi
